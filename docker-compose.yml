services:
  GenerateAcestreamLinkBot:
    image: oven/bun:1
    container_name: GenerateAcestreamLinkBot
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Europe/Rome # Imposta la variabile TimeZone per avere l'orario italiano nei logs
    command: ["sh", "-c", "bun install && bun run start"]
    restart: unless-stopped
    mem_limit: 1000m
    memswap_limit: 1000m